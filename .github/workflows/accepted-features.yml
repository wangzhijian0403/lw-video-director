name: LW Validated Video & Visual Assets CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: accepted-features-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  remotion-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: visual-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-studio/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Build TypeScript and Vite
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Accepted component manifest checks
        run: npm run test:accepted
      - name: Verify local MIT icon library integrity
        run: npm run assets:icons:check
      - name: Check icon overlay project contract
        run: npm run lint:project -- projects/visual-assets-smoke/project.json
      - name: Install checksum-validated OFL font
        run: python scripts/install-fred-font.py
      - name: Render integrated smoke MP4
        run: npm run direct -- projects/accepted-ft-smoke/project.json --out exports/accepted-ft-smoke.mp4 --concurrency 2
      - name: Render icon overlays on real FredTalk/LW scenes
        run: npm run direct -- projects/visual-assets-smoke/project.json --out exports/visual-assets-smoke.mp4 --concurrency 2
      - name: Render all three original illustrated scenes as real MP4
        run: npm run direct -- projects/illustration-scene-smoke/project.json --out exports/illustration-scene-smoke.mp4 --concurrency 2
      - name: Check local workbench health endpoint
        run: |
          node server.mjs > /tmp/lw-studio.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'let ok=false;for(let i=0;i<50;i++){try{const r=await fetch("http://127.0.0.1:4173/api/health");const j=await r.json();if(r.ok&&j.service==="LW Visual Studio"&&j.ready){ok=true;break}}catch{}await new Promise(done=>setTimeout(done,400))}if(!ok)process.exit(1);console.log("Local workbench /api/health: READY")'
      - name: Install ffprobe for output validation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Check real video format
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json exports/accepted-ft-smoke.mp4
          test -s exports/accepted-ft-smoke.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json exports/visual-assets-smoke.mp4
          test -s exports/visual-assets-smoke.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json exports/illustration-scene-smoke.mp4
          test -s exports/illustration-scene-smoke.mp4
